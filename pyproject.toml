[project]
name = "closure-core"
version = "0.1.0"
description = "Coverage-closure benchmark for agents: grader and design packs"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
check = ["pypdf>=4"]   # citation checks against cited PDFs
dev = ["pytest>=8"]    # tests/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["closure_core"]

[tool.hatch.build.targets.wheel.force-include]
"closure_core/sim_main.cpp" = "closure_core/sim_main.cpp"
