id: P18
description: 'While m_axis_tvalid is high with m_axis_tdata 8''h3C and m_axis_tready
  low, the receiver rejects a start bit: prescale_reg is 0, bit_cnt is 10 and rxd_reg
  is high. m_axis_tvalid must then stay high with overrun_error low until the next
  handshake, where m_axis_tvalid and m_axis_tready are both high and m_axis_tdata
  is 8''h3C.'
