id: P18
description: 'While m_axis_tvalid is high with m_axis_tdata 8''h3C and m_axis_tready
  low, the receiver rejects a start bit (prescale_reg 0, bit_cnt 10, rxd_reg high);
  m_axis_tvalid stays high with overrun_error low until a handshake (m_axis_tvalid
  and m_axis_tready high) transfers 8''h3C. After that, the receiver still takes in
  a complete new frame: m_axis_tvalid rises again with m_axis_tdata 8''hA5 and overrun_error
  low.'
