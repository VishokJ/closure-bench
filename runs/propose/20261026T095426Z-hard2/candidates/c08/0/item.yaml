id: P8
description: On uart_rx, overrun_error pulses while m_axis_tvalid is high and m_axis_tready
  is low. At the next handshake (m_axis_tvalid and m_axis_tready both high), m_axis_tdata
  is 8'hC3, overrun_error is low, and overrun_error has not pulsed again since the
  tracked pulse.
tier: T2
mechanism:
- sequence
- interaction
- boundary
cover: P8_overrun_then_accept_newest
