id: P19
description: 'On a clock where frame_error is high, m_axis_tvalid and m_axis_tready
  are both high and m_axis_tdata is 8''h3C, so the pending word is accepted during
  the frame-error strobe. On the next clock m_axis_tvalid is low and m_axis_tdata
  is still 8''h3C: the bad frame does not overwrite or re-validate the word just handed
  off.'
