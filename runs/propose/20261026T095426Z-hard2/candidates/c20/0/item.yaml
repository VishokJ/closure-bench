id: P20
description: On uart_tx, s_axis_tvalid rises on exactly the clock where the transmitter
  finishes its stop period (prescale_reg 0, bit_cnt 0, s_axis_tready low), right after
  a frame whose data bits on txd formed 8'hC3. On the next clock txd is low (new start
  bit) and s_axis_tready is high.
tier: T2
mechanism:
- boundary
- data
cover: P20_tvalid_rise_on_frame_end
