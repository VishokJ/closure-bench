  role: requirement
  doc: axis
  page: 18
  anchor: Either TVALID or TREADY can be asserted first, or both can be asserted in
    the same ACLK cycle.
- type: DOC
  role: requirement
  doc: axis
  page: 18
  anchor: For a transfer to occur, both TVALID and TREADY must be asserted.
