id: P25
description: On uart_tx, s_axis_tvalid rises (it was low on the previous clock) while
  busy is high and bit_cnt is between 1 and 8, with s_axis_tdata at 8'h3C. s_axis_tvalid
  and s_axis_tdata then stay unchanged until the byte is loaded, and the next frame
  shifts 8'h3C out on txd, sampled at its eight data-bit boundaries.
tier: T2
mechanism:
- boundary
- interaction
- data
- sequence
cover: P25_tvalid_rise_mid_frame
sources:
