id: P10
description: On uart_rx, after a first word with m_axis_tdata equal to 8'h3C has been
  accepted (m_axis_tvalid and m_axis_tready both high), a later word raises m_axis_tvalid
  on a clock where m_axis_tready is low. On the very next clock m_axis_tvalid is still
  high and m_axis_tready is high, so this second word, m_axis_tdata equal to 8'hA5,
  is accepted after exactly one stall cycle.
tier: T2
mechanism:
