id: P10
description: On uart_rx, m_axis_tvalid rises on a clock where m_axis_tready is low.
  On the very next clock m_axis_tvalid is still high and m_axis_tready is high, so
  the word is accepted after exactly one stall cycle with m_axis_tdata equal to 8'hA5.
