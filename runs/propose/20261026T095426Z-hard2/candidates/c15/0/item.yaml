id: P15
description: 'While m_axis_tvalid is high with m_axis_tdata 8''h3C and m_axis_tready
  low, the word is later accepted (m_axis_tready high) in a cycle where busy is high
  and bit_cnt is between 2 and 9 of the next frame. Without busy falling, that frame
  then completes: m_axis_tvalid rises with m_axis_tdata 8''hA5 and overrun_error low.'
