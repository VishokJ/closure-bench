id: P14
description: On uart_rx, frame_error pulses for a frame whose shifted-in data_reg
  is 8'h5A, while m_axis_tvalid is low and m_axis_tdata still holds the previously
  accepted word 8'hA5. The bad word is discarded and the old output data is kept.
