id: P21
description: On the first clock after rst falls, s_axis_tvalid is high while s_axis_tready
  is still low, with prescale_reg and bit_cnt both 0. On the next clock txd is low,
  s_axis_tready is high and bit_cnt is 9. The data bits then read on txd at the bit
  boundaries form 8'hA5.
tier: T2
mechanism:
- reset_timing
- data
- boundary
cover: P21_tvalid_first_clock_after_reset
