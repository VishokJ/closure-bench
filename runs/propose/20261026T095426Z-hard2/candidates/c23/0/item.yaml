id: P23
description: With prescale at 16'd2 throughout, uart_tx sends a frame whose txd samples
  at the eight data-bit boundaries (prescale_reg 19'd0, bit_cnt 8 down to 1) form
  8'h12. busy then stays high with no idle cycle into the next frame, which is loaded
  with s_axis_tvalid high. At that frame's bit_cnt 2 boundary, the txd samples of
  data bits 0 to 6 together with data_reg[0] (bit 7, not yet sent) form 8'h34.
tier: T3
mechanism:
- sequence
- data
- boundary
