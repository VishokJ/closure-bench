id: P17
description: rst is first sampled high on exactly the clock where a good stop bit
  is sampled (prescale_reg is 0, bit_cnt is 1, rxd_reg high) while m_axis_tvalid is
  low. After rst is released, m_axis_tvalid shows no word other than 8'h5A, and its
  first rise brings m_axis_tdata equal to 8'h5A from a new frame.
