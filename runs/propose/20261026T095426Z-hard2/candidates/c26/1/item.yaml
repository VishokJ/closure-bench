id: P26
description: 'With prescale at 16''d1, two words go out back-to-back: s_axis_tready
  pulses high while busy stays high, after s_axis_tvalid was high on the previous
  clock. At the end of the second word, with s_axis_tvalid low on the previous clock,
  busy falls and s_axis_tready rises on the same clock, exactly 9 clocks after bit_cnt
  was first seen 0 after being 1 (start of the stop bit).'
