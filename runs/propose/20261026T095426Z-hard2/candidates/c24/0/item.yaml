id: P24
description: With prescale held at 16'd1, txd rises at the start of a stop bit, which
  follows a 0 last data bit, on the clock where bit_cnt goes from 1 to 0. txd then
  stays high for exactly 9 clocks and falls as the next back-to-back start bit, with
  bit_cnt reloaded to 9 on that same clock.
