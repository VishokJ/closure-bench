id: P24
description: With prescale held at 16'd1 and three frames sent back-to-back, each
  of the first two frames ends with a 0 last data bit. txd rises at the stop bit,
  on the clock where bit_cnt goes from 1 to 0, and then stays high for exactly 9 clocks
  before falling as the next start bit, with bit_cnt reloaded to 9. The cover is reached
  when the second such 9-clock stop gap in a row ends.
tier: T3
