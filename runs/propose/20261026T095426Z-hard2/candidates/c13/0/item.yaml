id: P13
description: After a frame_error pulse, the receiver goes idle with busy low and rxd
  high for at least 16 consecutive clocks. The next frame then delivers m_axis_tdata
  8'hA5 as m_axis_tvalid rises, with no further frame_error pulse in between.
