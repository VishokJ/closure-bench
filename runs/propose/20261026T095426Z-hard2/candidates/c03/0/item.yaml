id: P3
description: 'After the receiver delivers a word (m_axis_tvalid rises while bit_cnt
  is 0), it accepts the next start bit (bit_cnt loads 4''d10) one or two clocks after
  that rise, with no false start or frame error in between. That second frame then
  completes: m_axis_tvalid rises again with m_axis_tdata 8''h5A and frame_error low.'
