id: P5
description: uart_rx raises m_axis_tvalid with m_axis_tdata 8'hA5 while prescale is
  16'd1. prescale then changes to 16'd2 on a clock where busy is low. The next rise
  of m_axis_tvalid shows m_axis_tdata 8'h5A with prescale still 16'd2, and frame_error
  stays low from the change until that rise.
