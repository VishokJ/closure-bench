id: P22
description: With prescale held at 16'd1, uart_tx accepts a byte (s_axis_tvalid high
  while idle) and shifts it out. Each of the eight data bits lasts exactly 8 clocks,
  measured from one bit boundary (prescale_reg 0) to the next. Sampled at the eight
  data-bit boundaries, txd forms 8'h96, and on the cycle after the last data bit txd
  is high and bit_cnt is 0.
tier: T1
mechanism:
- boundary
- data
cover: P22_tx_min_prescale_96
