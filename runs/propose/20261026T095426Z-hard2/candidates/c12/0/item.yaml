id: P12
description: Two consecutive words are delivered on m_axis_tdata (m_axis_tvalid high),
  8'h12 and then 8'h34, with no frame_error pulse between them. The frame carrying
  8'h34 is received with prescale held at 16'd2 from its start-bit detection until
  the word is delivered.
