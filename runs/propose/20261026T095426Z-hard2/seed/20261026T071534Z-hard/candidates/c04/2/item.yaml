id: P4
description: Two consecutive frames each carry a glitch inside a data bit (bit_cnt
  from 2 to 9), where the synchronised input rxd_reg toggles and toggles back while
  prescale_reg is non-zero and is unchanged on the sample cycle. The first frame delivers
  m_axis_tvalid rising with m_axis_tdata 8'hA5. The next frame delivers m_axis_tvalid
  rising with m_axis_tdata 8'h5A. frame_error and overrun_error stay low in between,
  and frame_error is low at the second delivery.
