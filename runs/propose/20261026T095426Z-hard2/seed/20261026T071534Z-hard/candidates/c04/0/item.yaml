id: P4
description: During a data bit (bit_cnt from 2 to 9), the synchronised input rxd_reg
  toggles and toggles back while prescale_reg is non-zero. Both edges fall between
  two sample points, and rxd_reg does not change on the sample cycle itself. The same
  frame then completes with m_axis_tvalid rising, m_axis_tdata equal to 8'hA5 and
  frame_error low.
