id: P1
description: On uart_rx, the sink accepts a pending word 8'h3C (m_axis_tvalid and
  m_axis_tready both high) on the same clock that a second good frame completes. On
  the next clock m_axis_tvalid is still high and m_axis_tdata is 8'hA5, so the second
  word is presented and not lost.
