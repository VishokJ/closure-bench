id: P2
description: frame_error pulses while rxd_reg is already low, so the receiver treats
  the low level as the next start bit and restarts at once. With bit_cnt not returning
  to 0 in between, that new frame completes and m_axis_tvalid rises with m_axis_tdata
  equal to 8'hA5.
