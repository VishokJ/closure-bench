id: P6
description: uart_tx sends one frame with prescale 1. After that frame has finished
  and busy is low, s_axis_tvalid starts a new frame with prescale 3. While prescale
  stays 3, every data bit (bit_cnt 8 down to 1) starts with prescale_reg reloaded
  to 19'd23, so each bit lasts 24 clocks. The txd values at those eight bit starts
  form 8'h5A.
tier: T3
mechanism:
- sequence
- data
cover: P6_tx_rate_change_5a
sources:
- type: README
  role: requirement
  file: third_party/verilog-uart/README.md
