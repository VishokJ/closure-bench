# Formal environment (closure_core/formal.py, tools/formal): one formal top per
# module a cover binds to. Hand-reviewed design-pack input; the assumptions
# live in the env files, each with its source.
#
# inputs: the formal top's free inputs besides clk; they must equal the DUT's
#   input port names and widths, because a witness is replayed on the DUT's
#   ports. outputs: the DUT's output ports, declared by the witness testbench.
# Formal measures; Verilator decides (a witness counts only if it scores 1).
#
# engine: the SymbiYosys engine of every witness search (closure_core.formal.ENGINES).
#   abc bmc3: on 12 benchmark covers (R3, R5, R6, R11 and 8 two-frame targets, 2026-10-26)
#   all three allowed engines found the same depth and every witness scored 1 under
#   Verilator; abc took 4-70 s per first solve (sum 173 s), smtbmc bitwuzla 10-86 s
#   (285 s), smtbmc yices 67-685 s (2560 s). abc also minimised in about 0.6x
#   bitwuzla's time.
# bound: cycles searched per cover. 300 fits two frames at prescale 1 (about 80
#   cycles each) plus reset (deepest plan item: 158), and a prescale-1 frame then a
#   prescale-3 frame (a transmitter target, 279). 240 would find every other
#   benchmark target (deepest 234) but reject that one as unreachable.
# timeout: seconds for the first solve per cover (tools/formal, the formal gate).
# minimize_timeout: seconds for the input-change minimisation after it, a separate
#   budget: when it runs out the witness is kept with input_changes_exact false.
#   180: every benchmark cover at prescale 1 minimised exactly within 175 s (R5);
#   the two deeper targets (234 and 279 cycles, a frame at prescale 2 or 3) took
#   523 s and 355 s, so they keep an inexact witness.
# frame_cycles: clocks per UART frame as an expression in the formal top's
#   inputs, used to measure a witness in frames (gates.witness_frames: the sum
#   over its cycles of 1 / frame_cycles at that cycle's inputs), so a slower
#   prescale does not make a target deeper. 80 = 10 bit periods (start, 8 data
#   bits at DATA_WIDTH 8, stop) of 8 * prescale clocks each: the bit counter
#   reloads with (prescale << 3) - 1 in uart_rx.v:111,118 and with
#   (prescale << 3) - 1 / (prescale << 3) in uart_tx.v:95,104,108.
# active_signal: a DUT output that is 1 while the module is working on a frame,
#   for the measure active_frames (the sum over witness cycles of
#   active_signal / frame_cycles): how much of a witness is protocol activity
#   rather than waiting. Recorded only, no gate uses it. busy_reg is set when a
#   start bit is seen (uart_rx.v:136) or a word is accepted (uart_tx.v:99) and
#   cleared when the module is idle again (uart_rx.v:131, uart_tx.v:91).
engine: abc bmc3
bound: 300
timeout: 900
minimize_timeout: 180
frame_cycles: 80 * prescale
active_signal: busy
tops:
  uart_rx:
    file: env_rx.sv
    module: formal_rx
    inputs: {rst: 1, rxd: 1, m_axis_tready: 1, prescale: 16}
    outputs: {m_axis_tdata: 8, m_axis_tvalid: 1, busy: 1, overrun_error: 1, frame_error: 1}
  uart_tx:
    file: env_tx.sv
    module: formal_tx
    inputs: {rst: 1, s_axis_tdata: 8, s_axis_tvalid: 1, prescale: 16}
    outputs: {s_axis_tready: 1, txd: 1, busy: 1}
