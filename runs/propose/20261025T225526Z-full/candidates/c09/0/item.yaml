id: P9
description: While the receiver is busy (busy 1) on a new frame and still holds an
  already handed-off word (m_axis_tdata 8'hA5, m_axis_tvalid 0), rst is sampled high.
  On the next clock, with rst still high, busy is 0, m_axis_tvalid is 0 and m_axis_tdata
  is 8'h00.
