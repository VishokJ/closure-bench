id: P8
description: With prescale held at 16'hFFFF, uart_tx accepts a byte and shifts it
  out on txd. Sampled at the eight data-bit boundaries, txd forms 8'h5A. On the cycle
  after the last data bit, prescale_reg is 19'h7FFF8, bit_cnt is 0 and txd is high
  (stop bit).
