# Probe: the 26 items written from runs/propose/20261026T095426Z-hard2 (R12-R29,
# T5-T12) only, bash harness (as pilot_bash.toml), k=2, Nemotron. Same as
# probe_hard2_nemotron.toml otherwise. Each rollout's testbench is kept in
# traces.jsonl (info.submission, info.submission_source) for regrading. Tags
# (padded vs the rest) are in configs/probe_hard2_tags.yaml. From the repo root
# with the venv activated:
#   vf-eval @ configs/probe_hard2_nemotron_bash.toml -o outputs/probe-hard2-bash
#   tools/analyze_eval outputs/probe-hard2-bash --out results/probe-hard2-bash \
#     --group-by-tag configs/probe_hard2_tags.yaml
model = "nvidia/nemotron-3-nano-30b-a3b"
num_rollouts = 2                 # rollouts per task (-r)
# Platform upload off: local traces in outputs/ are what the analysis reads.
push = false

[sampling]
temperature = 1.0
max_tokens = 32768               # per model response

[env.taskset]
id = "closure-bench"
design = "uart"
# Pinned by digest (tag verilator-5.020 at the time of pinning).
image = "docker.io/vishokjcs/closure-bench-toolchain@sha256:3678cddfbaca54b466be876f97aaa5beccdef1a71aced176bc6ba8ea293c4155"
# Must match the harness id below: it selects the prompt and installs run.sh.
harness = "bash"
# Agent wall clock (s); ~9 s per simulation. A timed-out run is still graded
# on whatever submission/tb.sv holds.
agent_timeout = 1200.0
# Stated in the prompt; must equal [env.agent] max_turns (checked at setup).
max_turns = 40
items = ["R12", "R13", "R14", "R15", "R16", "R17", "R18", "R19", "R20", "R21", "R22", "R23",
         "R24", "R25", "R26", "R27", "R28", "R29", "T5", "T6", "T7", "T8", "T9", "T10",
         "T11", "T12"]

[env.agent]
# Cost guard: each turn re-sends the growing context, so tokens (not wall
# clock) are the runaway risk. A capped run still finalizes and is graded.
max_turns = 40                   # = taskset max_turns above

[env.agent.harness]
id = "bash"

[env.agent.runtime]
type = "prime"

[env.agent.scoring]
mode = "isolated"
