# Pilot: every plan item with a gold (R1-R11, T1-T4), null harness (single
# reply, no tools), k=4, isolated grading in a fresh Prime sandbox. One run per
# model, from the repo root with the venv from the README activated:
#   vf-eval @ configs/pilot_null.toml -m google/gemini-4-argon
#   vf-eval @ configs/pilot_null.toml -m qwen/qwen3.8-27b
model = "google/gemini-4-argon"  # frontier; the trainable model is qwen/qwen3.8-27b (-m)
num_rollouts = 4                 # rollouts per task (-r)
# Platform upload off: local traces in outputs/ are what the analysis reads.
push = false

[sampling]
temperature = 1.0
max_tokens = 16000

[env.taskset]
id = "closure-bench"
design = "uart"
# Pinned by digest (tag verilator-5.020 at the time of pinning).
image = "docker.io/vishokjcs/closure-bench-toolchain@sha256:3678cddfbaca54b466be876f97aaa5beccdef1a71aced176bc6ba8ea293c4155"
harness = "null"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"

[env.agent.scoring]
mode = "isolated"
